name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: 🕵️ Lint files
        run: yarn lint

      - name: 🔍 Typecheck files
        run: yarn typecheck

      - name: 🛡️ Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: 🏗 Build package
        run: yarn prepare

  npm-release:
    name: npm-release
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'LottieFiles/dotlottie-react-native' && github.event_name == 'push' }}

    permissions:
      # Allow creating a release in the repository
      contents: write

      # Required for provenance
      id-token: write
      packages: write

      # Required for creating a release PR
      pull-requests: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # https://github.com/changesets/action/issues/201#issuecomment-1206088289
          # check out all commits and tags so changeset can skip duplicate tags
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup .npmrc (NPM)
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPMJS_TOKEN }}" >> ~/.npmrc

      - name: 🚀 Release to NPM
        uses: changesets/action@v1
        with:
          commit: 'chore: 🤖 update versions'
          title: 'chore: 🤖 update versions'
          publish: yarn release:publish
          version: yarn release:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Remove existing NPM .npmrc
        run: rm -f "$HOME/.npmrc"

  gpr-release:
    name: gpr-release
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'LottieFiles/dotlottie-react-native' && github.event_name == 'push' }}

    permissions:
      # Allow creating a release in the repository
      contents: write

      # Required for provenance
      id-token: write
      packages: write

      # Required for creating a release PR
      pull-requests: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure .npmrc for GitHub Packages
        run: |
          echo "@lottiefiles:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: 🚀 Release to GitHub Packages
        uses: changesets/action@v1
        with:
          commit: 'chore: 🤖 update versions'
          title: 'chore: 🤖 update versions'
          publish: yarn release:publish
          version: yarn release:version
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
